name: Build Horizon Mod

on:
  # Manual trigger.
  workflow_dispatch:
    inputs:
      mod_source:
        description: 'Mod folder, .hnmod URL, git/GitHub URL, or "test" for the issue #1 test mods'
        required: false
        default: ''
      horizon_version:
        description: 'Horizon release/Nightly tag to install, or "latest"'
        required: false
        default: 'latest'
      native_profile:
        description: 'Native build profile'
        required: true
        type: choice
        options: [performance, dev, release]
        default: performance
      mode:
        description: 'Build all mods into one importable package, or one package per mod'
        required: true
        type: choice
        options: [combined, separate]
        default: combined

  # Build when an issue is opened/reopened with the build-mod label, or gets it later.
  issues:
    types: [opened, reopened, labeled]

  # Build when someone comments "/build" (optionally with URLs) on an issue.
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: horizon-mod-build-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'build-mod')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/build'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install native build and launcher dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential pkg-config libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libxkbcommon0 libxcb-xkb1 libxcb1 libx11-xcb1

      - name: Compile Horizon native mods
        env:
          HORIZON_BUILDER_SKIP_DEPS: '1'
          GH_TOKEN: ${{ github.token }}
          HORIZON_VERSION: ${{ github.event.inputs.horizon_version || 'latest' }}
          NATIVE_PROFILE: ${{ github.event.inputs.native_profile || 'performance' }}
          BUILD_MODE: ${{ github.event.inputs.mode || 'combined' }}
          INPUT_SOURCE: ${{ github.event.inputs.mod_source }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          args=(--horizon-version "${HORIZON_VERSION:-latest}" --profile "${NATIVE_PROFILE:-performance}")
          if [[ "${BUILD_MODE:-combined}" == "separate" ]]; then
            args+=(--separate)
          fi

          if [[ -n "${INPUT_SOURCE:-}" ]]; then
            if [[ "$INPUT_SOURCE" == "test" || "$INPUT_SOURCE" == "test-mods" ]]; then
              args+=(--test-mods)
            else
              args+=("$INPUT_SOURCE")
            fi
          fi
          if [[ -n "${ISSUE_BODY:-}" ]]; then
            args+=(--issue-body "$ISSUE_BODY")
          fi
          if [[ -n "${COMMENT_BODY:-}" ]]; then
            args+=(--comment-body "$COMMENT_BODY")
          fi

          python3 scripts/build_mods.py "${args[@]}"

      - name: Write build summary
        if: always()
        run: |
          if [[ -f dist/manifest.json ]]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path("dist/manifest.json").read_text())
          print("## Horizon mod build\n")
          print(f"Base Horizon: `{data.get('horizon_version')}`  ")
          print(f"Profile: `{data.get('profile')}`  ")
          print(f"OK: **{data.get('ok')}**\n")
          for job in data.get("jobs", []):
              if job.get("status") != "built":
                  print(f"### `{job.get('name')}` failed\n")
                  print(f"```\n{job.get('error')}\n```\n")
                  continue
              mods = job.get("mods") or [{"id": job.get("mod_id"), "version": job.get("mod_version")}]
              names = ", ".join(
                  f"`{mod.get('id')}` {mod.get('version') or ''}".strip()
                  for mod in mods
              )
              print(f"### {names}\n")
              print(f"- Built version: `{job.get('built_version')}`")
              print(f"- Horizon revision: `{job.get('horizon_revision')}`")
              for hnmod in job.get("hnmods", []):
                  print(f"- Source bundle: `{hnmod.get('path')}` (sha256 `{hnmod.get('sha256')}`)")
              print(f"- Download: `{job.get('artifact')}`")
              base = job.get("horizon_base")
              print(f"- Install: `horizon-launcher import-build <artifact-zip> --version {base} --trust-unsigned`")
              print("  - If that base is already installed and prepared, omit `--version`.")
              print('  - `It is prepared already, from another installed version.` means success.')
          if data.get("errors"):
              print("### Errors\n")
              for error in data["errors"]:
                  print(f"- {error}")
          PY
          else
            echo "## Horizon mod build failed" >> "$GITHUB_STEP_SUMMARY"
            echo "No dist/manifest.json was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-mod-build-${{ github.run_number }}
          path: dist/**
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
